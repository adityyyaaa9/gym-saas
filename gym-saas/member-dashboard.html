<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Membership</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0d0c; --surface:#17191a; --surface-2:#1f2223; --line:#2b2e2f;
    --accent:#d6ff3f; --accent-dim:#9db82c; --text:#f2f1ec; --muted:#8d9291;
    --error:#ff5c4d; --warn:#ffb84d;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh;}
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 24px; border-bottom:1px solid var(--line); background:var(--surface);
  }
  header h1{font-family:'Oswald'; font-size:18px; text-transform:uppercase; margin:0;}
  .gym-name{color:var(--accent-dim); font-size:12px; margin-top:2px; text-transform:uppercase; letter-spacing:.06em;}
  #logoutBtn{
    background:none; border:1px solid var(--line); color:var(--muted); font-size:12px;
    padding:8px 14px; border-radius:3px; cursor:pointer;
  }
  #logoutBtn:hover{border-color:var(--accent); color:var(--text);}
  main{max-width:480px; margin:0 auto; padding:28px 20px;}

  .status-card{
    border-radius:6px; padding:24px; margin-bottom:20px; text-align:center;
  }
  .status-card.active{background:rgba(214,255,63,.08); border:1px solid rgba(214,255,63,.2);}
  .status-card.expiring{background:rgba(255,184,77,.08); border:1px solid rgba(255,184,77,.2);}
  .status-card.expired{background:rgba(255,92,77,.08); border:1px solid rgba(255,92,77,.2);}
  .status-card.pending{background:rgba(141,146,145,.08); border:1px solid var(--line);}

  .status-label{
    font-family:'Oswald'; font-size:13px; text-transform:uppercase; letter-spacing:.08em;
    margin:0 0 8px; font-weight:600;
  }
  .status-card.active .status-label{color:var(--accent-dim);}
  .status-card.expiring .status-label{color:var(--warn);}
  .status-card.expired .status-label{color:var(--error);}
  .status-card.pending .status-label{color:var(--muted);}

  .days-left{font-family:'Oswald'; font-size:48px; font-weight:700; margin:0; line-height:1;}
  .status-card.active .days-left{color:var(--accent);}
  .status-card.expiring .days-left{color:var(--warn);}
  .days-sub{color:var(--muted); font-size:13px; margin:6px 0 0;}

  .info-grid{display:grid; gap:12px;}
  .info-row{
    background:var(--surface); border:1px solid var(--line); border-radius:5px;
    padding:14px 16px; display:flex; justify-content:space-between; align-items:center;
  }
  .info-row .label{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:600;}
  .info-row .value{font-size:14px; font-weight:600; color:var(--text);}

  .renew-note{
    background:var(--surface-2); border:1px dashed var(--line); border-radius:5px;
    padding:14px 16px; margin-top:20px; font-size:13px; color:var(--muted); text-align:center; line-height:1.6;
  }
</style>
</head>
<body>
  <header>
    <div>
      <h1>My Membership</h1>
      <div class="gym-name" id="gymName">Loading…</div>
    </div>
    <button id="logoutBtn">Sign out</button>
  </header>

  <main id="main">
    <p style="color:var(--muted); text-align:center; padding:40px 0;">Loading…</p>
  </main>

<script>
  const raw = sessionStorage.getItem('member');
  if (!raw) {
    window.location.href = 'member-login.html';
  }

  const member = JSON.parse(raw);

  document.getElementById('gymName').textContent = member.gymName || 'Your Gym';
  document.getElementById('logoutBtn').addEventListener('click', () => {
    sessionStorage.removeItem('member');
    window.location.href = 'member-login.html';
  });

  function daysUntil(dateStr) {
    const today = new Date(); today.setHours(0,0,0,0);
    const target = new Date(dateStr + 'T00:00:00');
    return Math.round((target - today) / 86400000);
  }

  function formatDate(dateStr) {
    if (!dateStr) return '—';
    const [y,m,d] = dateStr.split('-');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${d} ${months[parseInt(m)-1]} ${y}`;
  }

  function render() {
    const main = document.getElementById('main');
    const status = member.status;
    const days = daysUntil(member.expiryDate);

    let cardClass = 'active';
    let statusLabel = 'Active';
    let daysBlock = '';
    let renewNote = '';

    if (status === 'pending') {
      cardClass = 'pending';
      statusLabel = 'Pending Approval';
      daysBlock = `<p class="days-sub" style="margin-top:0;">Your gym is reviewing your sign-up.<br>You'll be confirmed shortly.</p>`;
    } else if (status === 'expired' || days < 0) {
      cardClass = 'expired';
      statusLabel = 'Membership Expired';
      daysBlock = `<p class="days-left" style="color:var(--error);">0</p><p class="days-sub">days left</p>`;
      renewNote = `<div class="renew-note">Contact your gym to renew your membership.</div>`;
    } else if (days <= 3) {
      cardClass = 'expiring';
      statusLabel = 'Expiring Soon';
      daysBlock = `<p class="days-left">${days}</p><p class="days-sub">day${days !== 1 ? 's' : ''} left</p>`;
      renewNote = `<div class="renew-note">Your membership expires soon. Contact your gym to renew.</div>`;
    } else {
      cardClass = 'active';
      statusLabel = 'Active';
      daysBlock = `<p class="days-left">${days}</p><p class="days-sub">days remaining</p>`;
    }

    main.innerHTML = `
      <div class="status-card ${cardClass}">
        <p class="status-label">${statusLabel}</p>
        ${daysBlock}
      </div>

      <div class="info-grid">
        <div class="info-row">
          <span class="label">Name</span>
          <span class="value">${member.name || '—'}</span>
        </div>
        <div class="info-row">
          <span class="label">Phone</span>
          <span class="value">${member.phone || '—'}</span>
        </div>
        <div class="info-row">
          <span class="label">Plan</span>
          <span class="value">${member.plan} Month${member.plan > 1 ? 's' : ''}</span>
        </div>
        <div class="info-row">
          <span class="label">Started</span>
          <span class="value">${formatDate(member.startDate)}</span>
        </div>
        <div class="info-row">
          <span class="label">Expires</span>
          <span class="value">${formatDate(member.expiryDate)}</span>
        </div>
      </div>

      ${renewNote}
    `;
  }

  render();
</script>
</body>
</html>
