<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0d0c; --surface:#17191a; --surface-2:#1f2223; --line:#2b2e2f;
    --accent:#d6ff3f; --accent-dim:#9db82c; --text:#f2f1ec; --muted:#8d9291;
    --error:#ff5c4d; --warn:#ffb84d;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh;}
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 28px; border-bottom:1px solid var(--line); background:var(--surface);
  }
  header h1{font-family:'Oswald'; font-size:19px; text-transform:uppercase; margin:0; letter-spacing:.02em;}
  header .gymname{color:var(--accent-dim); font-size:12px; text-transform:uppercase; letter-spacing:.08em; margin-top:2px;}
  #logoutBtn{
    background:none; border:1px solid var(--line); color:var(--muted); font-size:12px;
    padding:8px 14px; border-radius:3px; cursor:pointer; font-family:'Inter';
  }
  #logoutBtn:hover{border-color:var(--accent); color:var(--text);}
  main{max-width:920px; margin:0 auto; padding:28px;}
  .tabs{display:flex; gap:8px; margin-bottom:20px; border-bottom:1px solid var(--line);}
  .tab{
    background:none; border:none; color:var(--muted); font-family:'Oswald'; font-weight:600;
    font-size:13px; text-transform:uppercase; letter-spacing:.04em; padding:10px 4px; margin-right:20px;
    cursor:pointer; border-bottom:2px solid transparent;
  }
  .tab.active{color:var(--text); border-bottom-color:var(--accent);}
  .badge{
    background:var(--accent); color:#0c0d0c; font-size:10px; font-weight:700;
    border-radius:10px; padding:1px 7px; margin-left:6px; vertical-align:middle;
  }
  .panel{display:none;}
  .panel.active{display:block;}
  .card-row{
    background:var(--surface); border:1px solid var(--line); border-radius:5px;
    padding:16px 18px; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .memberinfo .name{font-weight:600; font-size:15px; margin:0 0 4px;}
  .memberinfo .meta{color:var(--muted); font-size:12.5px; margin:0;}
  .memberinfo .meta span{color:var(--text);}
  .status-pill{
    font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;
    padding:3px 9px; border-radius:10px; white-space:nowrap;
  }
  .status-pill.expiring{background:rgba(255,184,77,.15); color:var(--warn);}
  .status-pill.expired{background:rgba(255,92,77,.15); color:var(--error);}
  .status-pill.ok{background:rgba(214,255,63,.12); color:var(--accent-dim);}
  .actions{display:flex; gap:8px;}
  .btn{
    border:none; border-radius:3px; font-family:'Inter'; font-weight:600; font-size:12.5px;
    padding:8px 14px; cursor:pointer;
  }
  .btn-approve{background:var(--accent); color:#0c0d0c;}
  .btn-approve:hover{background:#e2ff6b;}
  .btn-reject{background:none; border:1px solid var(--line); color:var(--muted);}
  .btn-reject:hover{border-color:var(--error); color:var(--error);}
  .empty{color:var(--muted); font-size:14px; text-align:center; padding:40px 0;}
  .toolbar{display:flex; justify-content:flex-end; margin-bottom:16px;}
  #exportBtn{
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    font-size:12.5px; font-weight:600; padding:9px 16px; border-radius:3px; cursor:pointer;
  }
  #exportBtn:hover{border-color:var(--accent);}
  .loading{color:var(--muted); text-align:center; padding:40px 0; font-size:14px;}
  .btn-add{
    background:var(--accent); color:#0c0d0c; border:none; border-radius:3px;
    font-family:'Oswald'; font-weight:600; font-size:13px; letter-spacing:.04em;
    text-transform:uppercase; padding:9px 18px; cursor:pointer;
  }
  .btn-add:hover{background:#e2ff6b;}
  .btn-delete{
    background:none; border:1px solid var(--line); color:var(--muted); font-size:12px;
    padding:6px 12px; border-radius:3px; cursor:pointer; font-family:'Inter'; font-weight:600;
  }
  .btn-delete:hover{border-color:var(--error); color:var(--error);}
  /* Modal */
  .modal-backdrop{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.65);
    align-items:center; justify-content:center; z-index:100;
  }
  .modal-backdrop.open{display:flex;}
  .modal{
    background:var(--surface); border:1px solid var(--line); border-radius:5px;
    width:100%; max-width:480px; padding:28px 28px 24px; margin:16px;
  }
  .modal h2{font-family:'Oswald'; font-size:20px; text-transform:uppercase; margin:0 0 20px;}
  .modal label{display:block; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:5px;}
  .modal .field{margin-bottom:16px;}
  .modal input, .modal select{
    width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:3px;
    color:var(--text); font-size:15px; padding:11px 13px; outline:none; appearance:none; -webkit-appearance:none;
  }
  .modal input:focus, .modal select:focus{border-color:var(--accent);}
  .modal-row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .modal-actions{display:flex; gap:10px; margin-top:4px;}
  .modal-actions .btn-save{
    flex:1; background:var(--accent); color:#0c0d0c; border:none; border-radius:3px;
    font-family:'Oswald'; font-weight:600; font-size:14px; text-transform:uppercase;
    letter-spacing:.04em; padding:12px; cursor:pointer;
  }
  .modal-actions .btn-save:hover{background:#e2ff6b;}
  .modal-actions .btn-save:disabled{opacity:.5; cursor:not-allowed;}
  .modal-actions .btn-cancel{
    background:none; border:1px solid var(--line); color:var(--muted); border-radius:3px;
    font-family:'Inter'; font-weight:600; font-size:13px; padding:12px 18px; cursor:pointer;
  }
  .modal-actions .btn-cancel:hover{border-color:var(--text); color:var(--text);}
  .modal-expiry-preview{
    background:var(--surface-2); border:1px dashed var(--line); border-radius:3px;
    padding:10px 13px; font-size:13px; color:var(--muted); margin-bottom:16px;
    display:flex; justify-content:space-between;
  }
  .modal-expiry-preview strong{color:var(--text);}
  #modalStatus{font-size:13px; color:var(--error); min-height:16px; margin-bottom:8px;}
</style>
</head>
<body>
  <header>
    <div>
      <h1>Dashboard</h1>
      <div class="gymname" id="gymNameLabel">Loading…</div>
    </div>
    <button id="logoutBtn">Sign out</button>
  </header>

  <main>
    <div class="tabs">
      <button class="tab active" data-tab="pending">Pending <span class="badge" id="pendingCount">0</span></button>
      <button class="tab" data-tab="active">Active Members</button>
    </div>

    <div class="toolbar" style="gap:10px;display:flex;">
      <button class="btn-add" id="addMemberBtn">+ Add Member</button>
      <button id="exportBtn">Export as CSV</button>
    </div>

    <div class="panel active" id="panel-pending">
      <div id="pendingList" class="loading">Loading…</div>
    </div>

    <div class="panel" id="panel-active">
      <div id="activeList" class="loading">Loading…</div>
    </div>
  </main>

<!-- Add Member Modal -->
<div class="modal-backdrop" id="addModal">
  <div class="modal">
    <h2>Add Member</h2>
    <div class="field">
      <label for="m_name">Full name</label>
      <input type="text" id="m_name" required>
    </div>
    <div class="field">
      <label for="m_phone">WhatsApp number</label>
      <input type="tel" id="m_phone" pattern="[0-9]{10}" maxlength="10" placeholder="10-digit mobile">
    </div>
    <div class="field">
      <label for="m_email">Email (optional)</label>
      <input type="email" id="m_email">
    </div>
    <div class="modal-row2">
      <div class="field">
        <label for="m_plan">Plan</label>
        <select id="m_plan">
          <option value="1">1 Month</option>
          <option value="3">3 Months</option>
          <option value="6">6 Months</option>
          <option value="12" selected>12 Months</option>
        </select>
      </div>
      <div class="field">
        <label for="m_start">Start date</label>
        <input type="date" id="m_start" required>
      </div>
    </div>
    <div class="modal-expiry-preview">
      <span>Membership ends</span>
      <strong id="m_expiryPreview">—</strong>
    </div>
    <div id="modalStatus"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelModalBtn">Cancel</button>
      <button class="btn-save" id="saveMemberBtn">Save Member</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, query, where, getDocs, doc, updateDoc, deleteDoc, getDoc, addDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ⚠️ Same config as login.html
  const firebaseConfig = {
    apiKey: "AIzaSyAVCYy5_3kfq-ghZD5xtYEPb4T33YokZO4",
    authDomain: "gym-saas-4e407.firebaseapp.com",
    projectId: "gym-saas-4e407",
    storageBucket: "gym-saas-4e407.firebasestorage.app",
    messagingSenderId: "661426535468",
    appId: "1:661426535468:web:3d6c9d8523e3ff007ba589"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentGymId = null;
  let currentGymName = '';

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = 'login.html';
      return;
    }
    // Find the gym doc whose ownerUid matches this logged-in user
    const gymsSnap = await getDocs(query(collection(db, 'gyms'), where('ownerUid', '==', user.uid)));
    if (gymsSnap.empty) {
      document.getElementById('gymNameLabel').textContent = 'No gym linked to this account';
      return;
    }
    const gymDoc = gymsSnap.docs[0];
    currentGymId = gymDoc.id;
    currentGymName = gymDoc.data().name;
    document.getElementById('gymNameLabel').textContent = currentGymName;

    loadPending();
    loadActive();
  });

  document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

  // Tabs
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    });
  });

  function daysUntil(dateStr) {
    const today = new Date(); today.setHours(0,0,0,0);
    const target = new Date(dateStr + 'T00:00:00');
    return Math.round((target - today) / 86400000);
  }

  function formatDate(dateStr) {
    const [y,m,d] = dateStr.split('-');
    return `${d}/${m}/${y}`;
  }

  async function loadPending() {
    const el = document.getElementById('pendingList');
    el.textContent = 'Loading…';
    const membersRef = collection(db, 'gyms', currentGymId, 'members');
    const snap = await getDocs(query(membersRef, where('status', '==', 'pending')));

    document.getElementById('pendingCount').textContent = snap.size;

    if (snap.empty) {
      el.innerHTML = '<div class="empty">No pending sign-ups.</div>';
      return;
    }

    el.innerHTML = '';
    snap.forEach(docSnap => {
      const m = docSnap.data();
      const row = document.createElement('div');
      row.className = 'card-row';
      row.innerHTML = `
        <div class="memberinfo">
          <p class="name">${m.name}</p>
          <p class="meta">${m.phone} &nbsp;·&nbsp; ${m.plan} month plan &nbsp;·&nbsp; starts <span>${formatDate(m.startDate)}</span></p>
        </div>
        <div class="actions">
          <button class="btn btn-approve" data-id="${docSnap.id}">Approve</button>
          <button class="btn btn-reject" data-id="${docSnap.id}">Reject</button>
        </div>`;
      row.querySelector('.btn-approve').addEventListener('click', () => approveMember(docSnap.id));
      row.querySelector('.btn-reject').addEventListener('click', () => rejectMember(docSnap.id));
      el.appendChild(row);
    });
  }

  async function approveMember(memberId) {
    const ref = doc(db, 'gyms', currentGymId, 'members', memberId);
    await updateDoc(ref, { status: 'active', reminderSent: false });
    loadPending();
    loadActive();
  }

  async function rejectMember(memberId) {
    if (!confirm('Reject and remove this sign-up?')) return;
    const ref = doc(db, 'gyms', currentGymId, 'members', memberId);
    await deleteDoc(ref);
    loadPending();
  }

  async function loadActive() {
    const el = document.getElementById('activeList');
    el.textContent = 'Loading…';
    const membersRef = collection(db, 'gyms', currentGymId, 'members');
    const snap = await getDocs(query(membersRef, where('status', 'in', ['active', 'expired'])));

    if (snap.empty) {
      el.innerHTML = '<div class="empty">No active members yet.</div>';
      return;
    }

    const rows = [];
    snap.forEach(docSnap => rows.push({ id: docSnap.id, ...docSnap.data() }));
    rows.sort((a, b) => daysUntil(a.expiryDate) - daysUntil(b.expiryDate));

    el.innerHTML = '';
    rows.forEach(m => {
      const days = daysUntil(m.expiryDate);
      let pillClass = 'ok', pillText = `${days}d left`;
      if (days < 0) { pillClass = 'expired'; pillText = 'Expired'; }
      else if (days <= 3) { pillClass = 'expiring'; pillText = `${days}d left`; }

      const row = document.createElement('div');
      row.className = 'card-row';
      row.innerHTML = `
        <div class="memberinfo">
          <p class="name">${m.name}</p>
          <p class="meta">${m.phone} &nbsp;·&nbsp; ${m.plan} month plan &nbsp;·&nbsp; expires <span>${formatDate(m.expiryDate)}</span></p>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="status-pill ${pillClass}">${pillText}</div>
          <button class="btn-delete" data-id="${m.id}">Delete</button>
        </div>`;
      row.querySelector('.btn-delete').addEventListener('click', () => deleteMember(m.id));
      el.appendChild(row);
    });
  }

  async function deleteMember(memberId) {
    if (!confirm('Delete this member permanently?')) return;
    await deleteDoc(doc(db, 'gyms', currentGymId, 'members', memberId));
    loadActive();
    loadPending();
  }

  // ---- Add Member Modal ----
  const modal = document.getElementById('addModal');
  const m_start = document.getElementById('m_start');
  const m_plan = document.getElementById('m_plan');
  const m_expiryPreview = document.getElementById('m_expiryPreview');

  m_start.valueAsDate = new Date();

  function computeModalExpiry() {
    const start = m_start.valueAsDate || new Date();
    const months = parseInt(m_plan.value, 10);
    const exp = new Date(start);
    exp.setMonth(exp.getMonth() + months);
    m_expiryPreview.textContent = exp.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
    return exp;
  }
  m_start.addEventListener('change', computeModalExpiry);
  m_plan.addEventListener('change', computeModalExpiry);
  computeModalExpiry();

  document.getElementById('addMemberBtn').addEventListener('click', () => {
    document.getElementById('modalStatus').textContent = '';
    modal.classList.add('open');
  });
  document.getElementById('cancelModalBtn').addEventListener('click', () => modal.classList.remove('open'));
  modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });

  document.getElementById('saveMemberBtn').addEventListener('click', async () => {
    const name = document.getElementById('m_name').value.trim();
    const phone = document.getElementById('m_phone').value.trim();
    const email = document.getElementById('m_email').value.trim();
    const statusEl = document.getElementById('modalStatus');

    if (!name || !phone) { statusEl.textContent = 'Name and phone are required.'; return; }
    if (!/^[0-9]{10}$/.test(phone)) { statusEl.textContent = 'Enter a valid 10-digit number.'; return; }

    const saveBtn = document.getElementById('saveMemberBtn');
    saveBtn.disabled = true; saveBtn.textContent = 'Saving…';

    const expiry = computeModalExpiry();
    try {
      await addDoc(collection(db, 'gyms', currentGymId, 'members'), {
        name, phone, email,
        plan: parseInt(m_plan.value, 10),
        startDate: m_start.value,
        expiryDate: expiry.toISOString().split('T')[0],
        status: 'active',
        reminderSent: false,
        createdAt: serverTimestamp()
      });
      modal.classList.remove('open');
      document.getElementById('m_name').value = '';
      document.getElementById('m_phone').value = '';
      document.getElementById('m_email').value = '';
      m_start.valueAsDate = new Date();
      m_plan.value = '12';
      computeModalExpiry();
      loadActive();
    } catch(err) {
      statusEl.textContent = 'Error: ' + err.message;
    }
    saveBtn.disabled = false; saveBtn.textContent = 'Save Member';
  });

  document.getElementById('exportBtn').addEventListener('click', async () => {
    const membersRef = collection(db, 'gyms', currentGymId, 'members');
    const snap = await getDocs(membersRef);
    let csv = 'Name,Phone,Email,Plan (months),Start Date,Expiry Date,Status\n';
    snap.forEach(d => {
      const m = d.data();
      csv += `"${m.name}","${m.phone}","${m.email||''}",${m.plan},${m.startDate},${m.expiryDate},${m.status}\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${currentGymName.replace(/\s+/g,'_')}_members.csv`;
    a.click();
  });
</script>
</body>
</html>
